name: Verify resume template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate fictional example
        run: python resume_pdf.py --manifest tmp/layout.json
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-resume-${{ matrix.os }}-py${{ matrix.python }}
          path: output/pdf/resume.pdf
